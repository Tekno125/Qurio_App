name: Sync Upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: frontendDev
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/yugata-dev/Qurio_App.git
          git fetch upstream
          git merge --ff-only upstream/frontendDev
          git push origin frontendDev
